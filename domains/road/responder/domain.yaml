# responder — the road family's fast member (road-family s-f62c0ed8; from road-world s-e812715d step 2): the proper
# response, holding the controls by priority; it beats at the world's step. No host here: the family is rules over roles;
# a consumer's package (metis-worlds road/domains/responder, metis-wheelchair domains/responder) names its own host and
# includes this program's units by name through METIS_HOME = this directory.
display: the responder
line: "the road's proper response: it brakes as RSS asks and stops a lateral move, then hands the controls back"
voice: third
program: responder.llp
clock: {beats: 1, period: 1}
shared: {type: world-private, safe_long: world-private, safe_lat: world-private, dangerous: world-private, safe_before: world-private, resp: world-private, safe_lat_left: world-private, safe_lat_right: world-private, resp_side: world-private, xing_case: world-private, xing_before: world-private, resp_lon: world-private, resp_lat: world-private, resp_lat_left: world-private, resp_lat_right: world-private, changing: world-private, signalled: world-private, settled_to: world-private, now: world-private, resp_unst: world-private, drive_away_sector: world-private, tick__want: out, tick__released: out, tick__gen: in, tick__active: out, tick__done: out, tick__grant: in, tick__cancel: in, controls: resource}
status: {success: [tick__done], failure: []}
gating: program
# the lint's lines (checks-open s-17e557f0; patterns CHECKS.md §3 L7, L9): the safety stages; the beliefs (none: the road's classes are
# what a car shows, never what it intends); the commands the host takes, matched at a `_` boundary (metis-worlds road/world/restrict.py)
safety: [act]
belief: []
commands: [accel, keep, brake, change, yield, inch, stop_lat, drive_away]
