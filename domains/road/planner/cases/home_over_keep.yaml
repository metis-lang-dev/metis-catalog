case: "668e45 on SUMO: on the oncoming lane past the standing car, at the target speed with room to keep (keep_limit applicable too): the return outranks the keep (change_home, a safety rule)"
boundaries:
  - world: [at_target, lead_ok, keep_ok, accel_ok, cross_settled(nextzone), adjacent(right), side_clear(right), own_kind(oncoming), lane_kind(right, driving), lane_kind(left, none), settled(right), settled(left), zone_at(nextzone, far), now]
    expect: {out: [tick__active(planner), tick__want(planner, controls)], status: running, fired: [drive]}
  - grant: [controls]
    deliver: [tick__grant(planner, controls)]
    expect: {status: running, fired: [change_home]}
