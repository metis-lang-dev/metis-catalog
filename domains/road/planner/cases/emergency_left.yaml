case: "the gap records (g), 13b2f9: an emergency vehicle behind me, no driving lane on my right (a parking lane), the driving lane on my left free: the planner moves over to the left (change_emergency_left)"
boundaries:
  - world: [at_target, lead_ok, keep_ok, cross_settled(nextzone), emergency(follower), adjacent(left), side_clear(left), adjacent(right), own_kind(driving), lane_kind(left, driving), lane_kind(right, parking), settled(left), settled(right), zone_at(nextzone, none), now]
    expect: {out: [tick__active(planner), tick__want(planner, controls)], status: running, fired: [drive]}
  - grant: [controls]
    deliver: [tick__grant(planner, controls)]
    expect: {status: running, fired: [change_emergency_left]}
