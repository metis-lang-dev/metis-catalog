case: "cr-harvest: on the oncoming lane beside the standing car, the pass still completing (no pass_blocked): no brake_pass_blocked; the planner keeps (keep_limit), as home_side_busy"
boundaries:
  - world: [at_target, lead_ok, keep_ok, accel_ok, cross_settled(nextzone), adjacent(right), side_busy(right), own_kind(oncoming), lane_kind(right, driving), lane_kind(left, none), settled(right), settled(left), zone_at(nextzone, far), now]
    expect: {out: [tick__active(planner), tick__want(planner, controls)], status: running, fired: [drive]}
  - grant: [controls]
    deliver: [tick__grant(planner, controls)]
    expect: {status: running, fired: [decide, keep_limit, back]}
