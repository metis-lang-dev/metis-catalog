case: "ec8088: my lane leaves my route and the right lane is busy (side_busy, no side_clear): no change, the planner goes on"
boundaries:
  - world: [at_target, lead_ok, cross_settled(nextzone), adjacent(right), side_busy(right), own_kind(driving), lane_kind(right, driving), lane_kind(left, none), settled(right), route_lane(right), zone_at(nextzone, near), now]
    expect: {out: [tick__active(planner), tick__want(planner, controls)], status: running, fired: [drive]}
  - grant: [controls]
    deliver: [tick__grant(planner, controls)]
    expect: {status: running, fired: [decide, back]}
