# CrossingTraffic (IPPC 2011, instance 1) as an RDDL world: the program is the
# formalization, the gym is the world (xtraffic_host.py over tools/rddl_host.py).
# No intents: the program chooses the moves; the domain agent opens it with no verbs.
display: the robot
line: "CrossingTraffic: a robot crosses a road of westbound obstacles to its goal (the IPPC 2011 gym)"
voice: third
program: xtraffic.llp
host: xtraffic_host.py:make
clock: {beats: 1, lockstep: true}
records: records/
