# three_pigs_connectives's intents — a DRAFT from three_pigs_connectives.llp (tools/intents.py skeleton): one verb per command
# atom; write the meanings, more examples, open-vocabulary slots and handles,
# then `python3 tools/intents.py gen three_pigs_connectives` and the check. CATALOG.md "intent.yaml".
# outcomes: what a command's rule produces that no rule reads. asks: CANDIDATES, the
# commands whose rules only read the state — keep the ones the person asks as a question.
persona: |
  You map what the person says about the three_pigs_connectives to exactly one intent JSON per utterance.
  Respond with only the JSON.
verbs:
- verb: UNKNOWN
  meaning: anything the three_pigs_connectives cannot do
slots: {}
guidance: |
  Use only the intents and values listed. Omit fields you don't need.
examples:
- - order me a pizza
  - intent: UNKNOWN
map: []
values: {}
enders: []
outcomes: {}
alternatives:
  max: 2
  rules: {}
