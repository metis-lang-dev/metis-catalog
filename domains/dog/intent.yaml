# The dog's intents (e2e-workflow s-143c3088, WORKFLOW.md stage 3): what the
# person may ask the dog, the schema the intent pass is held to, and how each
# intent maps to one command atom of dog.llp. The intent pass's grammar and
# prompts are GENERATED from this file, never written by hand:
#   python3 ../../tools/intents.py gen dog      (from this directory: intent/*)
# The outcomes are dog.llp's %% lines; the world (pairs, words, reports) is
# dog_host.py's.

persona: |
  You are Nina, a quadruped robot dog. The person is talking to YOU: you
  answer as Nina, in the first person ("I", "me"); never greet or address
  "Nina" yourself. Map what the person says to exactly one intent JSON per
  utterance. Respond with only the JSON.

  You NEVER output coordinates, velocities, or device commands — only the
  constrained intent below. The robot's planner and perception do the rest.

# the intent categories, in the schema's order (one row may name two)
verbs:
  - {verb: LOCAL_ACTION, meaning: "immediate body action (stand, sit, lie down, stretch, shake/give paw, turn, move a step or a short distance; distance_m in meters)"}
  - {verb: QUERY, meaning: "question about what the robot sees/knows; does not move the robot"}
  - {verb: NAVIGATE, meaning: "go to a goal the robot can resolve (object, region, room, landmark); AprilTags: goal type TAG plus tag_id (omit tag_id when no number is said)"}
  - {verb: FIND, meaning: "search for something (explore if not yet seen)"}
  - {verb: FOLLOW, meaning: "follow a dynamic target (usually a person)"}
  - {verb: STOP, meaning: "stop moving immediately"}
  - {verb: CANCEL, meaning: "cancel the current task"}
  - {verb: [TIME, DATE], meaning: "clock/calendar questions"}
  - {verb: CHITCHAT, meaning: "greeting or social remark to the robot"}
  - {verb: UNKNOWN, meaning: "anything the robot genuinely cannot do"}

# the intent JSON's fields after "intent", in this order; an object slot is
# {type, description, attributes?} with the types listed
slots:
  action: {enum: [STAND_UP, SIT_DOWN, LIE_DOWN, STRETCH, SHAKE, TURN, MOVE]}
  direction: {enum: [LEFT, RIGHT, AROUND, FORWARD, BACKWARD]}
  angle_deg: number
  duration: number
  distance_m: number
  target: {object: [OBJECT, PERSON, POSITION, REGION, ROOM, LANDMARK]}
  goal: {object: [OBJECT, PERSON, POSITION, REGION, ROOM, LANDMARK, TAG]}
  tag_id: number
  constraints: {relations: [NEAR, NEXT_TO, IN_FRONT_OF, BEHIND, "ON", UNDER, LEFT_OF, RIGHT_OF, CLOSEST_TO],
                reference: [OBJECT, PERSON, POSITION, REGION, ROOM, LANDMARK]}

guidance: |
  Targets are open vocabulary: put the person's words in `description`
  ("the black office chair with wheels" stays as said); `attributes` carries
  color/size/material when stated. Spatial phrases become `constraints`
  (NEAR, NEXT_TO, IN_FRONT_OF, BEHIND, ON, UNDER, LEFT_OF, RIGHT_OF,
  CLOSEST_TO) with a `reference` target. NAVIGATE uses `goal`; QUERY, FIND
  and FOLLOW use `target`. Omit fields you don't need.

# the mapper's examples (utterance, intent JSON), and notes between them
examples:
  - ["stand up", {"intent":"LOCAL_ACTION","action":"STAND_UP"}]
  - ["sit", {"intent":"LOCAL_ACTION","action":"SIT_DOWN"}]
  - ["lie down", {"intent":"LOCAL_ACTION","action":"LIE_DOWN"}]
  - ["lay down", {"intent":"LOCAL_ACTION","action":"LIE_DOWN"}]
  - ["turn left ninety degrees", {"intent":"LOCAL_ACTION","action":"TURN","direction":"LEFT","angle_deg":90}]
  - ["turn around", {"intent":"LOCAL_ACTION","action":"TURN","direction":"AROUND"}]
  - ["take a step forward", {"intent":"LOCAL_ACTION","action":"MOVE","direction":"FORWARD"}]
  - ["go one meter forward", {"intent":"LOCAL_ACTION","action":"MOVE","direction":"FORWARD","distance_m":1}]
  - ["back up half a meter", {"intent":"LOCAL_ACTION","action":"MOVE","direction":"BACKWARD","distance_m":0.5}]
  - ["take a step back", {"intent":"LOCAL_ACTION","action":"MOVE","direction":"BACKWARD"}]
  - ["give me your paw", {"intent":"LOCAL_ACTION","action":"SHAKE"}]
  - ["wave at me", {"intent":"LOCAL_ACTION","action":"SHAKE"}]
  - ["where is the chair", {"intent":"QUERY","target":{"type":"OBJECT","description":"chair"}}]
  - ["what is next to the table", {"intent":"QUERY","target":{"type":"OBJECT","description":"table"},"constraints":[{"relation":"NEXT_TO","reference":{"type":"OBJECT","description":"table"}}]}]
  - ["go to the door", {"intent":"NAVIGATE","goal":{"type":"OBJECT","description":"door"}}]
  - ["go to the chair next to the window", {"intent":"NAVIGATE","goal":{"type":"OBJECT","description":"chair"},"constraints":[{"relation":"NEXT_TO","reference":{"type":"OBJECT","description":"window"}}]}]
  - ["go to the kitchen", {"intent":"NAVIGATE","goal":{"type":"REGION","description":"kitchen"}}]
  - ["go to tag five", {"intent":"NAVIGATE","goal":{"type":"TAG","description":"tag"},"tag_id":5}]
  - ["walk to april tag three", {"intent":"NAVIGATE","goal":{"type":"TAG","description":"april tag"},"tag_id":3}]
  - ["go to the tag", {"intent":"NAVIGATE","goal":{"type":"TAG","description":"tag"}}]
  - ["find a fire extinguisher", {"intent":"FIND","target":{"type":"OBJECT","description":"fire extinguisher"}}]
  - ["go find the red chair near the window", {"intent":"FIND","target":{"type":"OBJECT","description":"chair","attributes":{"color":"red"}},"constraints":[{"relation":"NEAR","reference":{"type":"OBJECT","description":"window"}}]}]
  - ["follow me", {"intent":"FOLLOW","target":{"type":"PERSON","description":"the person"}}]
  - ["stop", {"intent":"STOP"}]
  - ["halt", {"intent":"STOP"}]
  - ["never mind", {"intent":"CANCEL"}]
  - ["forget it", {"intent":"CANCEL"}]
  - ["what time is it", {"intent":"TIME"}]
  - ["what's the date today", {"intent":"DATE"}]
  - ["what day is it", {"intent":"DATE"}]
  - ["good boy", {"intent":"CHITCHAT"}]
  - ["hello nina how are you", {"intent":"CHITCHAT"}]
  - note: "Statements that are not a request to you (someone reading a sentence aloud, talking to another person) are CHITCHAT if friendly, otherwise UNKNOWN; never turn them into a QUERY."
  - ["the robot is not armed", {"intent":"UNKNOWN"}]
  - ["order me a pizza", {"intent":"UNKNOWN"}]
  - note: "Flips, jumps, pouncing, rolling over and dancing are dangerous for this robot: always UNKNOWN, never LOCAL_ACTION."
  - ["do a front flip", {"intent":"UNKNOWN"}]
  - ["do a backflip", {"intent":"UNKNOWN"}]
  - ["roll over", {"intent":"UNKNOWN"}]
  - ["dance", {"intent":"UNKNOWN"}]
  - ["jump", {"intent":"UNKNOWN"}]
  - ["pounce", {"intent":"UNKNOWN"}]

# the spoken response after the JSON (pass 2), per chat template
spoken:
  heading: Spoken response (after the JSON)
  text: |
    After the JSON comes "Spoken response:" and one short sentence Nina says
    out loud, in the first person. It is never JSON and never an intent name.
    When you cannot or will not do something, say so plainly; when the person
    drops the task, acknowledge it.
  examples:
    - ["cancel that", {"intent":"CANCEL"}, "Okay, I'll drop it."]
    - ["walk on the ceiling", {"intent":"UNKNOWN"}, "I can't do that."]
    - ["do a handstand", {"intent":"UNKNOWN"}, "That's not safe for me, so I won't."]

# ── the mapper: an intent → one command atom (the card's table) ──
# atom templates: {slot:handle-kind} resolves the slot to a handle of that
# kind; {slot:valueset} looks the slot's value up in values
map:
  - {verb: LOCAL_ACTION, when: {action: STAND_UP}, atom: cmd_stand, act: stand}
  - {verb: LOCAL_ACTION, when: {action: SIT_DOWN}, atom: cmd_sit, act: sit}
  - {verb: LOCAL_ACTION, when: {action: LIE_DOWN}, atom: cmd_lie, act: lie}
  - {verb: LOCAL_ACTION, when: {action: TURN}, atom: "cmd_turn({direction:side})", act: turn}
  - {verb: LOCAL_ACTION, when: {action: MOVE}, atom: "cmd_move({direction:way})", act: move}
  - {verb: LOCAL_ACTION, when: {action: SHAKE}, atom: cmd_paw, act: paw}
  - {verb: NAVIGATE, atom: "cmd_go({goal:place})", act: go}
  - {verb: FIND, atom: "cmd_find({target:thing})", act: find}
  - {verb: FOLLOW, atom: cmd_follow, act: follow}
  - {verb: STOP, atom: cmd_stop, act: stop}
  - {verb: CANCEL, atom: cmd_cancel, act: cancel}
  - {verb: QUERY, atom: "cmd_query({target:thing})", act: query}
  - {verb: QUERY, atom: "cmd_look({target:place})", act: look}     # a query about a place
  - {verb: TIME, atom: cmd_time, act: time}
  - {verb: DATE, atom: cmd_date, act: date}
  - {verb: CHITCHAT, atom: cmd_chat, act: chat}
  - {verb: UNKNOWN, atom: cmd_unknown, act: unknown}
values:
  side: {LEFT: left, RIGHT: right, AROUND: around}
  way: {FORWARD: forward, BACKWARD: backward}

# the perception vocabulary: what a target resolves to (dog.llp's places and
# things), first match in this order; a standing handle stands for a place,
# never names one
handles:
  place:
    window_chair: {description: [chair], near: [window]}
    tag3: {type: [TAG], tag_id: 3}
    tag5: {type: [TAG], tag_id: 5}
    tag_near: {type: [TAG], tag_id: null}      # "go to the tag": the nearest
    door: {description: [door]}
    kitchen: {description: [kitchen]}
    sofa: {description: [sofa, couch]}
  thing:
    extinguisher: {description: [fire extinguisher, extinguisher]}
    keys: {description: [keys, key, my keys]}
    bottle: {description: [bottle]}
    chair: {description: [chair]}
    table: {description: [table]}
fallback: {place: elsewhere}     # a place the host cannot resolve: refused as not on the map
standing: [tag_near, elsewhere]

# the commands that end what runs: they act on the tick they arrive
enders: [cmd_stop, cmd_cancel]
# the verbs that ask the dog a question (QUERY: where a thing is, what is near it):
# words in question form mapped to one are never judged talk (CATALOG.md asks)
asks: [QUERY]

# ── the replier: outcome predicate → result status; a refusal's alternatives ──
outcomes: {done: done, refused: refused, progress: progress, expired: expired, cancelled: cancelled}
alternatives:
  max: 2
  # a refusal whose blocker is the place: the places mapped and open, in the catalog's order
  places: {rules: [go_unmapped, go_closed, go_blocked], act: go, slot: place, where: [mapped, open]}
  # a refusal with no blocker (the dog's own state): the way out, or none
  rules:
    turn_must_stand: [stand]
    move_must_stand: [stand]
    go_must_stand: [stand]
    follow_must_stand: [stand]
    go_busy: [cancel]
    go_busy_find: [cancel]
    go_busy_follow: [cancel]
    find_busy: [cancel]
    find_busy_find: [cancel]
    find_busy_follow: [cancel]
    follow_busy: [cancel]
    follow_busy_find: [cancel]
    sit_busy: [stop]
    lie_busy: [stop]
    turn_busy: [stop]
    move_busy: [stop]
    paw_busy: [stop]
    stand_already: []
    sit_already: []
    lie_already: []
    follow_already: []
    stop_still: []
    unknown: []
