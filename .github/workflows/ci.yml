name: ci

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '23 5 * * 1'        # weekly: toolchain drift against master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalogs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: metis-catalog
      - name: Checkout metis-lang@master (public toolchain)
        uses: actions/checkout@v4
        with:
          repository: metis-lang-dev/metis-lang
          ref: master
          path: metis-lang
      - name: Install OCaml + build metisc
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ocaml-nox
          make -C metis-lang metisc
      - name: check.sh (roundtrip every catalog + canonical keys)
        run: sh metis-catalog/ci/check.sh
      # metispy (public sibling): the loader lives there since metis-packages
      # s-65778b98 (metis_catalog re-exports metis.catalog.manifests), and the
      # cross-check below compiles every clean catalog under the python referee
      - name: Checkout metispy (public sibling)
        uses: actions/checkout@v4
        with:
          repository: metis-lang-dev/metispy
          path: metispy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: intents (each domain's generated intent files are what its intent.yaml makes)
        run: |
          python3 -m pip install --quiet pyyaml ./metispy     # the generator is metispy's metis.intents
          cd metis-catalog && for f in domains/*/intent.yaml; do METIS_CATALOG=$PWD python3 -m metis.intents check "$(basename "$(dirname "$f")")"; done
      - name: the loader (metis_catalog — every manifest whole, the consoles' index, list)
        run: |
          python3 -m pip install --quiet pyyaml pytest -e ./metispy
          cd metis-catalog && python3 -m pytest -q tests && python3 -m metis_catalog list --domains
      - name: diagnose.sh (no error diagnostics; reasoned exemptions)
        run: sh metis-catalog/ci/diagnose.sh
      - name: crosscheck.py (metispy agrees with metisc)
        run: |
          pip install -e ./metispy
          cd metis-catalog && python ci/crosscheck.py

  # pi-release s-8e13f6a8: the wheel publish.yml uploads, built and installed
  # in a fresh venv outside the checkout with metispy from PyPI
  wheel:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: metis-catalog
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the sdist and the wheel
        run: |
          python -m pip install -q build
          python -m build --outdir dist metis-catalog
      - name: Smoke-install the wheel in a fresh venv, outside the checkout
        run: bash metis-catalog/tools/smoke_wheel.sh dist

  # catalog-packages s-a2c529d6: every package run and built by both toolchains
  # (ci/packages.py) — `metisc --run` of its # case against goldens/traces/,
  # metispy's twin of the same run (I/T/F lines), and `metisc --wire` of the
  # served program against metispy's bundle ground.wire; the CI cases in
  # goldens/cases/ against their traces. A job of its own: talespin grounds
  # 105k events in metisc for its run and again for its wire (~2 min each,
  # run side by side with --jobs 2).
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: metis-catalog
      - name: Checkout metis-lang@master (public toolchain)
        uses: actions/checkout@v4
        with:
          repository: metis-lang-dev/metis-lang
          ref: master
          path: metis-lang
      - name: Checkout metispy (public sibling)
        uses: actions/checkout@v4
        with:
          repository: metis-lang-dev/metispy
          path: metispy
      - name: Install OCaml + build metisc
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ocaml-nox
          make -C metis-lang metisc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: packages.py (every package's trace, its metispy twin, its wire)
        run: |
          pip install --quiet pyyaml -e ./metispy
          cd metis-catalog && python ci/packages.py --jobs 2
      # spec 17 §4 (linker s-5908724a step 2): kitchen_pot links to one image (metisc --link, every L-check over the
      # I-checks, the derived director compared with its hand one); its hash == domains/kitchen_pot/image.golden.
      # No METIS_HOME: metisc finds its own standard units (iface/: the protocol and the tree director; spec/17 am. 5).
      - name: the link (kitchen_pot's image hash)
        run: |
          cd metis-catalog/domains/kitchen_pot
          env -u METIS_HOME "$GITHUB_WORKSPACE/metis-lang/src/metisc" --link composition.yaml --check | tee "$RUNNER_TEMP/link.txt"
          grep -qx "image kitchen_pot v-$(cat image.golden)" "$RUNNER_TEMP/link.txt"
