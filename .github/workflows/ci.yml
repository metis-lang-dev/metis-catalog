name: ci

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '23 5 * * 1'        # weekly: toolchain drift against master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalogs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: metis-catalog
      - name: Checkout metis-lang@master (public toolchain)
        uses: actions/checkout@v4
        with:
          repository: metis-lang-dev/metis-lang
          ref: master
          path: metis-lang
      - name: Install OCaml + build metisc
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ocaml-nox
          make -C metis-lang metisc
      - name: check.sh (roundtrip every catalog + canonical keys)
        run: sh metis-catalog/ci/check.sh
      - name: intents (each domain's generated intent files are what its intent.yaml makes)
        run: |
          python3 -m pip install --quiet pyyaml
          cd metis-catalog && for f in domains/*/intent.yaml; do python3 tools/intents.py check "$(basename "$(dirname "$f")")"; done
      - name: the loader (metis_catalog — every manifest whole, the consoles' index, list)
        run: |
          python3 -m pip install --quiet pyyaml pytest
          cd metis-catalog && python3 -m pytest -q tests && python3 -m metis_catalog list --domains
      - name: diagnose.sh (no error diagnostics; reasoned exemptions)
        run: sh metis-catalog/ci/diagnose.sh
      # the cross-check against metispy (public sibling): every clean
      # catalog compiles under the python referee too
      - name: Checkout metispy (public sibling)
        uses: actions/checkout@v4
        with:
          repository: metis-lang-dev/metispy
          path: metispy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: crosscheck.py (metispy agrees with metisc)
        run: |
          pip install -e ./metispy
          cd metis-catalog && python ci/crosscheck.py
