name: ci

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '23 5 * * 1'        # weekly: toolchain drift against master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalogs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAVE_READ_TOKEN: ${{ secrets.METIS_READ_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: metis-catalog
      - name: Checkout metis-lang@master (public toolchain)
        uses: actions/checkout@v4
        with:
          repository: metis-lang-dev/metis-lang
          ref: master
          path: metis-lang
      - name: Install OCaml + build metisc
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ocaml-nox
          make -C metis-lang metisc
      - name: check.sh (roundtrip every catalog + canonical keys)
        run: sh metis-catalog/ci/check.sh
      - name: diagnose.sh (no error diagnostics; reasoned exemptions)
        run: sh metis-catalog/ci/diagnose.sh
      # metispy is PRIVATE: GITHUB_TOKEN cannot read it. The cross-check
      # runs when the repo secret METIS_READ_TOKEN (fine-grained PAT,
      # Contents: read on metis-lang-dev/metispy) exists; otherwise it
      # says so in the job summary instead of passing silently.
      - name: Checkout metispy (private; needs METIS_READ_TOKEN)
        if: env.HAVE_READ_TOKEN == 'true'
        uses: actions/checkout@v4
        with:
          repository: metis-lang-dev/metispy
          token: ${{ secrets.METIS_READ_TOKEN }}
          path: metispy
      - uses: actions/setup-python@v5
        if: env.HAVE_READ_TOKEN == 'true'
        with:
          python-version: '3.12'
      - name: crosscheck.py (metispy agrees with metisc)
        if: env.HAVE_READ_TOKEN == 'true'
        run: |
          pip install -e ./metispy
          cd metis-catalog && python ci/crosscheck.py
      - name: Cross-check NOT run (no METIS_READ_TOKEN)
        if: env.HAVE_READ_TOKEN != 'true'
        run: |
          echo "::warning::metispy cross-check skipped: add repo secret METIS_READ_TOKEN (fine-grained PAT, Contents: read on metis-lang-dev/metispy)"
          echo "### metispy cross-check NOT run — secret METIS_READ_TOKEN missing (Contents: read on metis-lang-dev/metispy)" >> "$GITHUB_STEP_SUMMARY"
