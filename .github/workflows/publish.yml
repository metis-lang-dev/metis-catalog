name: publish

# metis-catalog to PyPI by trusted publishing (pi-release s-8e13f6a8; metispy's
# flow): the PyPI project's pending publisher is owner metis-lang-dev, repo
# metis-catalog, this workflow (publish.yml), environment `pypi` (no required
# reviewer: the tag is the release). No secret, no token: the upload
# authenticates with the job's OIDC identity.
#
#   a push of a tag vX.Y.Z   build, check the tag against pyproject's version,
#                            smoke-install the wheel, then upload: a tag publishes
#                            straight through (`gh release create vX.Y.Z` pushes it)
#   workflow_dispatch        the dry run: build, check, smoke; no upload
#
# A release (README "Releasing"): bump `version` in pyproject.toml (and
# metis_catalog.__version__), commit, `gh release create vX.Y.Z`.
# workflow_dispatch is the only dry run.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: metis-catalog
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The tag is pyproject's version
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('metis-catalog/pyproject.toml', 'rb'))['project']['version'])")
          m=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' metis-catalog/metis_catalog/__init__.py)
          echo "pyproject version: $v, metis_catalog.__version__: $m"
          [ "$m" = "$v" ] || { echo "::error::metis_catalog.__version__ $m is not pyproject.toml's $v"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "$GITHUB_REF_NAME" = "v$v" ] || { echo "::error::tag $GITHUB_REF_NAME is not v$v (pyproject.toml's version): bump the version, or tag v$v"; exit 1; }
          fi
          echo "### metis-catalog $v ($GITHUB_REF_TYPE $GITHUB_REF_NAME)" >> "$GITHUB_STEP_SUMMARY"
      - name: Build the sdist and the wheel
        # from outside the source tree: a build/ directory there would shadow the `build` module
        run: |
          python -m pip install -q build
          python -m build --outdir dist metis-catalog
          ls -l dist
      - name: Smoke-install the wheel in a fresh venv, outside the checkout
        # metispy from PyPI: every package builds its bundle by name
        run: bash metis-catalog/tools/smoke_wheel.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/metis-catalog/
    permissions:
      id-token: write          # trusted publishing: the OIDC token is the credential
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
